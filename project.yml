# XcodeGen spec: run `xcodegen` to create DailyLogger.xcodeproj (it isn't committed).
name: DailyLogger
options:
  bundleIdPrefix: dev.kapil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LoggerCore:
    path: LoggerCore
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  DailyLogger:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: LoggerCore
    entitlements:
      path: App/DailyLogger.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daily Logger
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Daily Logger reads your sleep and workouts to write them to your calendar.
        NSCalendarsFullAccessUsageDescription: Daily Logger writes sleep, workouts, places and commutes to the calendar you choose.
        NSLocationWhenInUseUsageDescription: Daily Logger uses your location to save home, office and gym.
        NSLocationAlwaysAndWhenInUseUsageDescription: Daily Logger notices when you arrive at or leave home, the office and the gym, to log commutes.
        NSMotionUsageDescription: Daily Logger uses motion to find drives when your car's Bluetooth automation isn't set up.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.kapil.dailylogger.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DL_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
